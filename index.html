    }

        opacity: 0;
        transform: translateY(8px);

    .typing-dot:nth-child(3) { animation: pulseDot 1.2s infinite 0.4s; }

    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    .zp {
      fill: rgba(255,255,255,0.03);
      stroke: rgba(255,255,255,0.45);
      stroke-width: 1.2;
      stroke-dasharray: 4 3;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
      transition: fill .15s ease, stroke .15s ease, stroke-width .15s ease;
      outline: none;
      stroke-linejoin: round;
    }
    .tone-light .zp {
      fill: rgba(26,26,26,0.04);
      stroke: rgba(26,26,26,0.55);
    }
    .zp:hover, .zp:focus-visible, .zp.hovered {
      fill: color-mix(in srgb, var(--c) 38%, transparent);
      stroke: var(--c);
      stroke-dasharray: none;
      stroke-width: 2.6;
    }
    .zp.all {
      fill: color-mix(in srgb, var(--c) 26%, transparent);
      stroke: var(--c);
      stroke-dasharray: none;
      stroke-width: 1.8;
    }
    .zp.active {
      fill: color-mix(in srgb, var(--c) 46%, transparent);
      stroke: var(--c);
      stroke-dasharray: none;
      stroke-width: 3.2;
    }
    .vdot { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; transition: left .18s ease, top .18s ease; }
    .vdot-pt { width: 12px; height: 12px; border-radius: 9999px; background: var(--c); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); flex: none; }
    .vdot-active .vdot-pt { animation: ping 1.8s ease-out infinite; }
    .vdot-label {
      position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); white-space: nowrap;
      padding: 3px 9px; border-radius: 9999px; background: #fff; color: #1A1A1A; font-size: 11px; font-weight: 600;
      border: 1.5px solid var(--c); box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    @keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 70%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
    .vnav {
      position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 15;
      background: rgba(255,255,255,.92); color: #1A1A1A; border: 1px solid #E4E1DA; transition: background .15s, transform .15s;
    }
    .vnav:hover { background: #fff; color: #C7281E; transform: translateY(-50%) scale(1.06); }
    .vtip {
      position: absolute; z-index: 25; pointer-events: none; padding: 6px 12px; border-radius: 9999px; background: #fff; color: #1A1A1A;

    @keyframes vfadeIn { from { opacity: 0; } to { opacity: 1; } }
    .vfade { animation: vfadeIn .25s ease-out; }
    @media (prefers-reduced-motion: reduce) { .vdot-active .vdot-pt, .vfade, .animate-page { animation: none; } }
    button:focus-visible { outline: 2px solid #C7281E; outline-offset: 2px; }

    /********************************************************************
     * HELPER FUNCTIONS
     ********************************************************************/
    function getZone(zoneId) {
      return ZONES_DATA.find(z => z.id === zoneId) || null;
    }

    function getComplianceBadge(level) {
      if (level === 'green') {
        return {
          bg: 'bg-[#EAF5EF]',
          text: 'text-[#2F8F5B]',
          border: 'border-[#2F8F5B]/30',
          dot: 'bg-[#2F8F5B]',
          hex: '#2F8F5B',
          tintHex: '#EAF5EF',
          label: 'Allowed'
        };
      }
      if (level === 'yellow') {
        return {
          bg: 'bg-[#FDF4E7]',
          text: 'text-[#B7791F]',
          border: 'border-[#B7791F]/30',
          dot: 'bg-[#B7791F]',
          hex: '#B7791F',
          tintHex: '#FDF4E7',
          label: 'Needs approval'
        };
      }
      return {
        bg: 'bg-[#FBEAE9]',
        text: 'text-[#B3261E]',
        border: 'border-[#B3261E]/30',
        dot: 'bg-[#B3261E]',
        hex: '#B3261E',
        tintHex: '#FBEAE9',
        label: 'Needs PBT + engineer'
      };
    }

    function getDeduplicatedChecklist() {
      const groups = {
        'Documents': [],
        'Deposit': [],
        'Work hours': [],
        'Safety': []
      };
      const itemMap = new Map();

      for (const zId of state.selectedZones) {
        const zone = getZone(zId);
        if (!zone) continue;
        for (const req of zone.requirements) {
          if (!itemMap.has(req.text)) {
            const entry = { group: req.group, text: req.text, zones: [zone] };
            itemMap.set(req.text, entry);
            if (groups[req.group]) {
              groups[req.group].push(entry);
            }
          } else {
            const existing = itemMap.get(req.text);
            if (!existing.zones.some(z => z.id === zone.id)) {
              existing.zones.push(zone);
            }
          }
        }
      }

      const allItems = Array.from(itemMap.values());
      const totalCount = allItems.length;
      const checkedCount = allItems.filter(i => state.checkedItems.includes(i.text)).length;
      const percentage = totalCount === 0 ? 0 : Math.round((checkedCount / totalCount) * 100);
      const hasRedZone = state.selectedZones.some(id => {
        const z = getZone(id);
        return z && z.level === 'red';
      });

      return { groups, totalCount, checkedCount, percentage, hasRedZone };
    }

    function showToast(message, type = 'default') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const colorClass = type === 'red'
        ? 'bg-[#FBEAE9] text-[#B3261E] border-[#B3261E]'
        : 'bg-[#F7F6F3] text-[#1A1A1A] border-[#E4E1DA]';
      toast.className = `px-4 py-3 rounded-[16px] border border-t-[3px] border-t-[#f48436] text-sm font-medium flex items-center gap-2.5 animate-page pointer-events-auto ${colorClass}`;
      toast.innerHTML = `
        <span class="w-2 h-2 rounded-full bg-[#e93b30] shrink-0"></span>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 2600);
    }

    /********************************************************************
     * ACTIONS & NAVIGATION
     ********************************************************************/
    function navigate(route, extra = {}) {
      let targetJumpView = null;
      if (extra.zoneId) {
        state.activeZoneId = extra.zoneId;
        targetJumpView = pickBestViewForZone(extra.zoneId);
      }
      if (extra.postId) {
        state.selectedPostId = extra.postId;
      }
      if (!state.mode && route !== '/welcome' && route !== '/setup') {
        state.route = '/welcome';
      } else {
        state.route = route;
      }
      try {
        if (window.location.hash !== '#' + state.route) {
          history.replaceState(null, '', '#' + state.route);
        }
      } catch (err) {}
      renderApp();
      if (route === '/explorer') {
        if (targetJumpView && targetJumpView !== state.viewId) {
          setView(targetJumpView);
        } else {
          syncExplorerStageMedia(false);
        }
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleLogoTap() {
      state.logoTapCount += 1;
      if (state.logoTapTimer) clearTimeout(state.logoTapTimer);
      if (state.logoTapCount >= 5) {
        state.logoTapCount = 0;
        resetDemoState();
        showToast("Demo reset complete! Returned to Welcome screen.");
        return;
      }
      state.logoTapTimer = setTimeout(() => {
        state.logoTapCount = 0;
      }, 1800);
    }

    function resetDemoState() {
      state.mode = null;
      state.project = 'Bandar Bukit Raja';
      state.unitType = 'Terrace house';
      state.selectedZones = [];
      state.checkedItems = [];
      state.activeZoneId = 'structural-wall';
      state.viewId = 'l1';
      state.isVideoPlaying = false;
      state.showAllColors = false;
      state.posts = JSON.parse(JSON.stringify(INITIAL_POSTS));
      state.route = '/welcome';
      renderApp();
    }

    function startExploreMode() {
      state.mode = 'explore';
      if (state.selectedZones.length === 0) {
        state.selectedZones = ['structural-wall'];
      }
      navigate('/home');
      showToast("Switched to 'Just exploring' mode");
    }

    function startRenovateSetup() {
      navigate('/setup');
    }

    function completeSetup(e) {
      if (e) e.preventDefault();
      const projSelect = document.getElementById('setup-project');
      const unitSelect = document.getElementById('setup-unit');
      if (projSelect) state.project = projSelect.value;
      if (unitSelect) state.unitType = unitSelect.value;
      state.mode = 'renovate';
      navigate('/home');
      showToast(`Renovate mode ready: ${state.project} (${state.unitType})`);
    }

    function handleSwitchModeButton() {
      if (state.mode === 'renovate') {
        state.mode = 'explore';
        showToast("Switched to 'Just exploring' mode");
        if (state.route === '/welcome' || state.route === '/setup') {
          state.route = '/home';
        }
        renderApp();
      } else {
        navigate('/setup');
      }
    }

    function toggleZoneInChecklist(zoneId) {
      const idx = state.selectedZones.indexOf(zoneId);
      const zone = getZone(zoneId);
      if (idx === -1) {
        state.selectedZones.push(zoneId);
        showToast(`Added "${zone.name}" to your checklist`);
      } else {
        state.selectedZones.splice(idx, 1);
        const validTexts = new Set();
        state.selectedZones.forEach(id => {
          const z = getZone(id);
          if (z) z.requirements.forEach(r => validTexts.add(r.text));
        });
        state.checkedItems = state.checkedItems.filter(t => validTexts.has(t));
        showToast(`Removed "${zone.name}" from checklist`);
      }
      if (state.route === '/explorer') {
        refreshExplorerUIOnly();
        updateHeaderAndSidebarChecklistBadges();
      } else {
        renderApp();
      }
    }

    function toggleChecklistItem(encodedText) {
      const text = decodeURIComponent(encodedText);
      const idx = state.checkedItems.indexOf(text);
      if (idx === -1) {
        state.checkedItems.push(text);
      } else {
        state.checkedItems.splice(idx, 1);
      }
      renderApp();
    }

      state.mode = 'renovate';
      state.project = 'Bandar Bukit Raja';

      state.selectedZones = ['structural-wall'];
      state.checkedItems = [];

      state.viewId = 'l1';
      state.showAllColors = true;
      navigate('/explorer');
      showToast("Loaded Ali's Demo Story: Terrace House Structural Wall (Red)");
    }

    function zonesInView(viewId) { return DRAW_ORDER.filter(z => ZONE_SHAPES[z] && ZONE_SHAPES[z][viewId]); }

    function pickBestViewForZone(zoneId) {
      if (ZONE_SHAPES[zoneId] && ZONE_SHAPES[zoneId][state.viewId]) return state.viewId;
      const list = viewsForZone(zoneId);
      if (!list.length) return state.viewId;
      const curMode = viewById(state.viewId).mode;
      const pick = list.find(v => v.mode === curMode) || list[0];
      return pick.id;
    }

    function ensureZoneVisible(zoneId) {
      const pickId = pickBestViewForZone(zoneId);
      if (pickId !== state.viewId) {

    function polyBox(pts) {
      const arr = pts.trim().split(/\s+/).map(p => p.split(',').map(Number));
      const xs = arr.map(a => a[0]), ys = arr.map(a => a[1]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      // Compute true polygon centroid for accurate pin placement on angled 3D walls
      let cx = (x0 + x1) / 2;
      let cy = (y0 + y1) / 2;
      if (arr.length >= 3) {
        let signedArea = 0, sumX = 0, sumY = 0;
        for (let i = 0; i < arr.length; i++) {
          const [xA, yA] = arr[i];
          const [xB, yB] = arr[(i + 1) % arr.length];
          const cross = xA * yB - xB * yA;
          signedArea += cross;
          sumX += (xA + xB) * cross;
          sumY += (yA + yB) * cross;
        }
        if (Math.abs(signedArea) > 1e-3) {
          cx = sumX / (3 * signedArea);
          cy = sumY / (3 * signedArea);
        }
      }
      return { cx, cy, area: (x1 - x0) * (y1 - y0) };
    }

    function getPolygonsForZoneAndView(zoneId, viewId) {
      if (viewId === 'plan') {
        return (ZONE_SHAPES[zoneId] && ZONE_SHAPES[zoneId].plan) || [];
      }
      return getProjected3DPolygons(zoneId, viewId);
    }

    function zoneAnchor(zoneId, viewId) {
      const polys = getPolygonsForZoneAndView(zoneId, viewId);
      let best = null;
      polys.forEach(p => { const b = polyBox(p); if (!best || b.area > best.area) best = b; });
      return best;
    }

    // Three.js Architectural Scene Controller (synchronizes camera movement + cutaway animations + exact 3D wall projection)
    const threeHouse = {
      initialized: false,
      renderer: null,
      scene: null,
      camera: null,
      raycaster: null,
      roofGroup: null,

      toPose: null,

    };

    const CAMERA_POSES = {
      front: {
        camPos: { x: 14.5, y: 7.8, z: 15.8 },
        lookAt: { x: 1.5, y: 2.1, z: 0.8 },

        l2Y: 0,
        l2Opacity: 1
      }
    };

    // Helper to register an exact 3D quad face (4 world-space corners in order) for a zone in specific views
    function registerZoneFace(zoneId, views, corners3D, groupRef = 'l1') {
      threeHouse.zoneFaceDefs.push({ zoneId, views, corners3D, groupRef });
    }

    // Projects the 3D vertices of a zone's faces onto 2D stage percentage coordinates (0..100)
    // so the SVG polygon outline hugs the exact perspective angle of every wall!
    function getProjected3DPolygons(zoneId, viewId) {
      initThreeHouseIfNeeded();
      if (!threeHouse.initialized || !threeHouse.camera) return [];

      // Temporarily ensure camera is at the target view's resting pose if we're querying while paused
      const targetPose = threeHouse.isAnimating && threeHouse.currentPose
        ? threeHouse.currentPose
        : (CAMERA_POSES[viewId] || CAMERA_POSES.l1);

      const cam = threeHouse.camera;
      cam.position.set(targetPose.camPos.x, targetPose.camPos.y, targetPose.camPos.z);
      cam.lookAt(targetPose.lookAt.x, targetPose.lookAt.y, targetPose.lookAt.z);
      cam.updateMatrixWorld(true);
      cam.updateProjectionMatrix();

      const matchingFaces = threeHouse.zoneFaceDefs.filter(
        f => f.zoneId === zoneId && f.views.includes(viewId)
      );

      const polys = [];
      const tmpVec = new THREE.Vector3();

      matchingFaces.forEach(face => {
        const pts2D = [];
        let behindCamera = false;
        face.corners3D.forEach(([wx, wy, wz]) => {
          tmpVec.set(wx, wy, wz);
          tmpVec.project(cam);
          if (tmpVec.z > 1.0) behindCamera = true;
          const px = ((tmpVec.x + 1) * 0.5) * 100;
          const py = ((-tmpVec.y + 1) * 0.5) * 100;
          pts2D.push(`${px.toFixed(2)},${py.toFixed(2)}`);
        });
        if (!behindCamera && pts2D.length >= 3) {
          polys.push(pts2D.join(' '));
        }
      });

      return polys;
    }

    function initThreeHouseIfNeeded() {
      const canvas = document.getElementById('house-3d-canvas');
      if (!canvas || typeof THREE === 'undefined') return;

      if (threeHouse.initialized && threeHouse.renderer && threeHouse.renderer.domElement === canvas) {
        resizeThreeHouse();
        return;
      }

      const stage = document.getElementById('vstage');
      const w = (stage && stage.clientWidth) || 720;
      const h = (stage && stage.clientHeight) || 440;

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, h, false);
      renderer.shadowMap.enabled = true;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x232b35);

      const camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 200);
      const raycaster = new THREE.Raycaster();

      threeHouse.interactiveMeshes = [];
      threeHouse.zoneFaceDefs = [];

      // Lighting matching architectural renders
      const hemi = new THREE.HemisphereLight(0xfff8ed, 0x3b4836, 0.88);
      scene.add(hemi);

      const dirLight = new THREE.DirectionalLight(0xfff1d6, 0.95);
      dirLight.position.set(16, 26, 18);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Ground & Lush Corner Lawn + Stepping Stones + Side Deck
      const turfMat = new THREE.MeshLambertMaterial({ color: 0x4b7435 });
      const turf = new THREE.Mesh(new THREE.BoxGeometry(26, 0.3, 22), turfMat);
      turf.position.set(0, -0.15, 0);
      scene.add(turf);

      // Driveway & Road
      const driveMat = new THREE.MeshLambertMaterial({ color: 0x6f7378 });
      const driveway = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.32, 6.2), driveMat);
      driveway.position.set(5.2, -0.13, 0.2);
      scene.add(driveway);

      // Helper to create a tagged 3D box mesh with subtle architectural edge lines
      const createZoneMesh = (grp, zoneId, wBox, hBox, dBox, x, y, z, baseHex, isTransparentGroup = false, rotX = 0) => {
        const mat = new THREE.MeshLambertMaterial({
          color: baseHex,
          transparent: isTransparentGroup,
          opacity: 1,
          emissive: 0x000000,
          emissiveIntensity: 0
        });
        const geom = new THREE.BoxGeometry(wBox, hBox, dBox);
        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.set(x, y, z);
        if (rotX) mesh.rotation.x = rotX;
        mesh.userData = { zoneId, baseHex, isTransparentGroup };

        // Subtle crisp architectural edge outline on every 3D part
        const edges = new THREE.EdgesGeometry(geom);
        const lineMat = new THREE.LineBasicMaterial({
          color: 0x1a1a1a,
          transparent: true,
          opacity: 0.22
        });
        const lineSeg = new THREE.LineSegments(edges, lineMat);
        mesh.add(lineSeg);
        mesh.userData.edgeLine = lineSeg;

        grp.add(mesh);
        if (zoneId) {
          threeHouse.interactiveMeshes.push(mesh);
        }
        return mesh;
      };

      // LEVEL 1 GROUP (Ground Floor Cutaway Interior + Walls + Exterior)
      const level1Group = new THREE.Group();
      const l1H = 2.6;

      // L1 Main Floor Slab
      createZoneMesh(level1Group, null, 11.2, 0.24, 7.2, -0.8, 0.12, 0, 0xe6e1d8);

      // 1. SIDE TERRACE & GARDEN DECK ('side-terrace')
      createZoneMesh(level1Group, 'side-terrace', 5.2, 0.26, 3.8, -0.2, 0.13, 5.5, 0x7a563e);
      const umbrella = new THREE.Mesh(new THREE.ConeGeometry(1.65, 0.6, 8), new THREE.MeshLambertMaterial({ color: 0xf4efe6 }));
      umbrella.position.set(-0.2, 1.85, 5.8);
      umbrella.userData = { zoneId: 'side-terrace', baseHex: 0xf4efe6 };
      threeHouse.interactiveMeshes.push(umbrella);
      level1Group.add(umbrella);
      registerZoneFace('side-terrace', ['front', 'side', 'rear', 'l1', 'l2'], [
        [-2.8, 0.26, 3.6], [2.4, 0.26, 3.6], [2.4, 0.26, 7.4], [-2.8, 0.26, 7.4]
      ]);

      // Stepping stones
      const stoneMat = new THREE.MeshLambertMaterial({ color: 0x9aa0a6 });
      [[-4.2, 5.2], [-3.3, 5.5], [3.2, 5.4], [4.1, 5.8], [5.0, 5.3]].forEach(([sx, sz]) => {
        const st = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.08, 12), stoneMat);
        st.position.set(sx, 0.04, sz);
        scene.add(st);
      });

      // 2. REAR EXTENSION & YARD ('rear-extension')
      createZoneMesh(level1Group, 'rear-extension', 2.4, 0.25, 4.2, -5.8, 0.13, 1.5, 0xc8c3b8);
      createZoneMesh(level1Group, 'rear-extension', 2.4, l1H, 0.28, -5.8, l1H / 2, 3.46, 0xedeae2);
      createZoneMesh(level1Group, 'rear-extension', 0.28, l1H, 4.2, -6.86, l1H / 2, 1.5, 0xedeae2);
      // Rear extension 3D faces (side wall, back wall, and top footprint in L1)
      registerZoneFace('rear-extension', ['side', 'rear'], [
        [-7.0, 0.1, 3.6], [-4.6, 0.1, 3.6], [-4.6, l1H, 3.6], [-7.0, l1H, 3.6]
      ]);
      registerZoneFace('rear-extension', ['rear'], [
        [-7.0, 0.1, -0.6], [-7.0, 0.1, 3.6], [-7.0, l1H, 3.6], [-7.0, l1H, -0.6]
      ]);
      registerZoneFace('rear-extension', ['l1'], [
        [-7.0, 0.3, -0.6], [-4.6, 0.3, -0.6], [-4.6, 0.3, 3.6], [-7.0, 0.3, 3.6]
      ]);

      // 3. STRUCTURAL WALLS, BEAMS & COLUMNS ('structural-wall')
      // Party wall along back (z = -3.45)
      createZoneMesh(level1Group, 'structural-wall', 11.2, l1H, 0.36, -0.8, l1H / 2, -3.45, 0xd4ccc0);
      // Staircase structural core wall (x = 0.2 .. 3.6, z = -1.1)

    // Highlights the active and hovered 3D walls/parts directly in the 3D WebGL scene
    function updateThreeWallHighlights() {
      if (!threeHouse.initialized || !threeHouse.interactiveMeshes) return;

      const activeId = state.activeZoneId;
      const hoveredId = state.hoveredZoneId;
      const showAll = state.showAllColors;

      threeHouse.interactiveMeshes.forEach(mesh => {
        const zId = mesh.userData.zoneId;
        if (!zId || !mesh.material) return;
        const zone = getZone(zId);
        if (!zone) return;
        const badge = getComplianceBadge(zone.level);
        const ruleColor = new THREE.Color(badge.hex);
        const baseColor = new THREE.Color(mesh.userData.baseHex || 0xffffff);

        const isSelected = zId === activeId;
        const isHovered = zId === hoveredId;

        if (isSelected || isHovered) {
          mesh.material.color.copy(baseColor).lerp(ruleColor, isHovered ? 0.58 : 0.45);
          if (mesh.material.emissive) {
            mesh.material.emissive.copy(ruleColor);
            mesh.material.emissiveIntensity = isHovered ? 0.28 : 0.18;
          }
          if (mesh.userData.edgeLine) {
            mesh.userData.edgeLine.material.color.copy(ruleColor);
            mesh.userData.edgeLine.material.opacity = 0.95;
          }
        } else if (showAll) {
          mesh.material.color.copy(baseColor).lerp(ruleColor, 0.28);
          if (mesh.material.emissive) {
            mesh.material.emissive.setHex(0x000000);
            mesh.material.emissiveIntensity = 0;
          }
          if (mesh.userData.edgeLine) {
            mesh.userData.edgeLine.material.color.copy(ruleColor);
            mesh.userData.edgeLine.material.opacity = 0.65;
          }
        } else {
          mesh.material.color.copy(baseColor);
          if (mesh.material.emissive) {
            mesh.material.emissive.setHex(0x000000);
            mesh.material.emissiveIntensity = 0;
          }
          if (mesh.userData.edgeLine) {
            mesh.userData.edgeLine.material.color.setHex(0x1a1a1a);
            mesh.userData.edgeLine.material.opacity = 0.22;
          }
        }
      });

      if (threeHouse.renderer && threeHouse.scene && threeHouse.camera) {
        threeHouse.renderer.render(threeHouse.scene, threeHouse.camera);
      }
    }

    // Raycasts mouse cursor directly against the 3D house walls when paused so any wall under the cursor is selectable
    function bindStage3DPointerEvents() {
      const stage = document.getElementById('vstage');
      if (!stage || stage.dataset.raycastBound === 'true') return;
      stage.dataset.raycastBound = 'true';

      stage.addEventListener('mousemove', (e) => {
        if (state.isVideoPlaying || viewById(state.viewId).type !== 'video') return;
        // If hovering a button or nav arrow, ignore
        if (e.target && e.target.closest && e.target.closest('button')) return;

        // If hovering an SVG polygon directly, use its data-zone
        const polyZone = e.target && e.target.getAttribute && e.target.getAttribute('data-zone');
        if (polyZone) {
          if (state.hoveredZoneId !== polyZone) {
            state.hoveredZoneId = polyZone;
            updateHoveredPolygonClasses();
            updateThreeWallHighlights();
          }
          zoneTip(e, polyZone);
          return;
        }

        // Otherwise raycast into the 3D architectural model
        const hitZone = raycast3DZoneAtEvent(e);
        if (hitZone) {
          if (state.hoveredZoneId !== hitZone) {
            state.hoveredZoneId = hitZone;
            updateHoveredPolygonClasses();
            updateThreeWallHighlights();
          }
          stage.style.cursor = 'pointer';
          zoneTip(e, hitZone);
        } else {
          if (state.hoveredZoneId) {
            state.hoveredZoneId = null;
            updateHoveredPolygonClasses();
            updateThreeWallHighlights();
          }
          stage.style.cursor = 'default';
          hideZoneTip();
        }
      });

      stage.addEventListener('mouseleave', () => {
        if (state.hoveredZoneId) {
          state.hoveredZoneId = null;
          updateHoveredPolygonClasses();
          updateThreeWallHighlights();
        }
        hideZoneTip();
      });

      stage.addEventListener('click', (e) => {
        if (state.isVideoPlaying || viewById(state.viewId).type !== 'video') return;
        if (e.target && e.target.closest && (e.target.closest('button') || e.target.closest('polygon'))) return;
        const hitZone = raycast3DZoneAtEvent(e);
        if (hitZone) {
          selectZoneInExplorer(hitZone);
        }
      });
    }

    function updateHoveredPolygonClasses() {
      const stage = document.getElementById('vstage');
      if (!stage) return;
      stage.querySelectorAll('polygon.zp').forEach(p => {
        const zid = p.getAttribute('data-zone');
        if (zid && zid === state.hoveredZoneId) {
          p.classList.add('hovered');
        } else {
          p.classList.remove('hovered');
        }
      });
    }

    function raycast3DZoneAtEvent(e) {
      if (!threeHouse.initialized || !threeHouse.raycaster || !threeHouse.camera) return null;
      const stage = document.getElementById('vstage');
      if (!stage) return null;
      const rect = stage.getBoundingClientRect();
      const ndcX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      const ndcY = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      threeHouse.raycaster.setFromCamera({ x: ndcX, y: ndcY }, threeHouse.camera);

      // Filter only visible meshes in the current cutaway level
      const visibleCandidates = threeHouse.interactiveMeshes.filter(m => {
        if (!m.visible) return false;
        let p = m.parent;
        while (p) {
          if (!p.visible) return false;
          p = p.parent;
        }
        return true;
      });

      const hits = threeHouse.raycaster.intersectObjects(visibleCandidates, false);
      const allowedInView = zonesInView(state.viewId);
      for (const hit of hits) {
        const zId = hit.object && hit.object.userData && hit.object.userData.zoneId;
        if (zId && allowedInView.includes(zId)) {
          return zId;
        }
      }
      return null;
    }

    function resizeThreeHouse() {
      if (!threeHouse.initialized || !threeHouse.renderer || !threeHouse.camera) return;
      const stage = document.getElementById('vstage');
      if (!stage) return;
      const w = stage.clientWidth || 720;
      const h = stage.clientHeight || 440;
      threeHouse.renderer.setSize(w, h, false);
      threeHouse.camera.aspect = w / h;
      threeHouse.camera.updateProjectionMatrix();
      if (threeHouse.currentPose) {
        applyThreePose(threeHouse.currentPose);
      }
    }

    function setGroupOpacity(group, yOffset, opacity) {
      if (!group) return;
      group.position.y = yOffset;
      group.visible = opacity > 0.03;
      group.traverse(obj => {
        if (obj.isMesh && obj.material) {
          obj.material.transparent = opacity < 0.99;
          obj.material.opacity = opacity;
        }
      });
    }

    function applyThreePose(pose) {
      if (!threeHouse.initialized) return;
      threeHouse.currentPose = pose;
      threeHouse.camera.position.set(pose.camPos.x, pose.camPos.y, pose.camPos.z);
      threeHouse.camera.lookAt(pose.lookAt.x, pose.lookAt.y, pose.lookAt.z);
      threeHouse.camera.updateMatrixWorld(true);
      setGroupOpacity(threeHouse.roofGroup, pose.roofY, pose.roofOpacity);
      setGroupOpacity(threeHouse.level2Group, pose.l2Y, pose.l2Opacity);
      updateThreeWallHighlights();
    }

    function animateThreeCamera(fromViewId, toViewId, playTransition, onComplete) {
      initThreeHouseIfNeeded();
      if (!threeHouse.initialized) {
        if (onComplete) onComplete();
        return;
      }

      if (threeHouse.animFrame) {
        cancelAnimationFrame(threeHouse.animFrame);
        threeHouse.animFrame = null;
      }

      const targetPose = CAMERA_POSES[toViewId] || CAMERA_POSES.l1;
      if (!playTransition) {
        threeHouse.isAnimating = false;
        applyThreePose(targetPose);
        if (onComplete) onComplete();
        return;
      }

      threeHouse.isAnimating = true;

      // Pick starting pose for smooth transition or replay
      let startPose = threeHouse.currentPose || CAMERA_POSES[fromViewId];
      if (!fromViewId || fromViewId === toViewId) {
        const pairMap = { l1: 'l2', l2: 'l1', front: 'side', side: 'front', rear: 'side' };
        startPose = CAMERA_POSES[pairMap[toViewId] || 'front'];
      }

      const startTime = performance.now();
      const duration = 1040; // Matches the 1.04s MP4 clips

      const lerp = (a, b, t) => a + (b - a) * t;
      const easeInOutCubic = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

      function step(now) {
        const rawT = Math.min(1, (now - startTime) / duration);
        const t = easeInOutCubic(rawT);

        const interpolated = {
          camPos: {
            x: lerp(startPose.camPos.x, targetPose.camPos.x, t),
            y: lerp(startPose.camPos.y, targetPose.camPos.y, t),
            z: lerp(startPose.camPos.z, targetPose.camPos.z, t)
          },
          lookAt: {
            x: lerp(startPose.lookAt.x, targetPose.lookAt.x, t),
            y: lerp(startPose.lookAt.y, targetPose.lookAt.y, t),
            z: lerp(startPose.lookAt.z, targetPose.lookAt.z, t)
          },
          roofY: lerp(startPose.roofY, targetPose.roofY, t),
          roofOpacity: lerp(startPose.roofOpacity, targetPose.roofOpacity, t),
          l2Y: lerp(startPose.l2Y, targetPose.l2Y, t),
          l2Opacity: lerp(startPose.l2Opacity, targetPose.l2Opacity, t)
        };

        applyThreePose(interpolated);

        if (rawT < 1) {
          threeHouse.animFrame = requestAnimationFrame(step);
        } else {
          threeHouse.animFrame = null;
          threeHouse.isAnimating = false;
          applyThreePose(targetPose);
          if (onComplete) onComplete();
        }
      }

      threeHouse.animFrame = requestAnimationFrame(step);
    }

    function resolveVideoSrc(filename) {
      if (state.customVideoUrls && state.customVideoUrls[filename]) {
        return state.customVideoUrls[filename];
      }
      return filename;
    }

    function handleCustomVideoFiles(event) {
      const files = Array.from((event.target && event.target.files) || []);
      if (!files.length) return;
      let count = 0;
      files.forEach(file => {
        const blobUrl = URL.createObjectURL(file);
        state.customVideoUrls[file.name] = blobUrl;
        count++;
        if (file.name.toLowerCase().endsWith('.png') || file.name.toLowerCase().endsWith('.jpg')) {
          const planImg = document.getElementById('house-plan-img');
          if (planImg) {
            planImg.src = blobUrl;
            planImg.style.opacity = '1';
          }
        }
      });
      showToast(`Loaded ${count} media file(s) into 3D Explorer`);
      syncExplorerStageMedia(true, null);
    }

    // Synchronizes the <video> element, Three.js 3D Engine, and 2D floorplan with the target view
    function syncExplorerStageMedia(playTransition = true, prevViewId = null) {
      const view = viewById(state.viewId);
      const videoEl = document.getElementById('house-video');
      const canvasEl = document.getElementById('house-3d-canvas');
      const planWrapEl = document.getElementById('house-plan-wrap');
      if (!videoEl || !canvasEl || !planWrapEl) return;

      if (view.type === 'image') {
        videoEl.pause();
        videoEl.classList.add('hidden');
        canvasEl.classList.add('hidden');
        planWrapEl.classList.remove('hidden');
        state.isVideoPlaying = false;
        refreshExplorerUIOnly();
        return;
      }

      // It's a 3D video/animation view
      planWrapEl.classList.add('hidden');
      canvasEl.classList.remove('hidden');
      videoEl.classList.remove('hidden');

      // 1. Always run the synchronized Three.js 3D camera transition so the stage is never black
      if (playTransition) {
        state.isVideoPlaying = true;
        refreshExplorerUIOnly();
        animateThreeCamera(prevViewId, view.id, true, () => {
          if (state.isVideoPlaying) {
            state.isVideoPlaying = false;
            refreshExplorerUIOnly();
          }
        });
      } else {
        state.isVideoPlaying = false;
        animateThreeCamera(prevViewId, view.id, false);
        refreshExplorerUIOnly();
      }

      // 2. Also attempt to play the exact MP4 video clip on top if accessible
      const directClip = prevViewId ? TRANSITION_VIDEOS[`${prevViewId}->${view.id}`] : null;
      const clipName = playTransition ? (directClip || view.replayVideo) : view.defaultVideo;
      const resolvedSrc = resolveVideoSrc(clipName);
      state.activeVideoSrc = resolvedSrc;

      videoEl.onloadeddata = () => {
        videoEl.style.opacity = '1';
      };
      videoEl.onerror = () => {
        // Hide video layer so the live 3D architectural render underneath shines through cleanly
        videoEl.style.opacity = '0';
      };

      if (playTransition) {
        videoEl.onended = () => {
          videoEl.pause();
          state.isVideoPlaying = false;
          refreshExplorerUIOnly();
        };

        if (videoEl.getAttribute('src') !== resolvedSrc) {
          videoEl.setAttribute('src', resolvedSrc);
          videoEl.load();
        }
        try { videoEl.currentTime = 0; } catch (e) {}
        const playPromise = videoEl.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(() => {
            videoEl.style.opacity = '0';
          });
        }
      } else {
        videoEl.pause();
        if (videoEl.getAttribute('src') !== resolvedSrc) {
          videoEl.setAttribute('src', resolvedSrc);
          videoEl.load();
        }
        const setRestingFrame = () => {
          try {
            videoEl.currentTime = view.defaultPose === 'end' ? Math.max(0, (videoEl.duration || 1) - 0.05) : 0;
            videoEl.style.opacity = '1';
          } catch (e) {}
        };
        if (videoEl.readyState >= 2) {
          setRestingFrame();
        } else {
          videoEl.addEventListener('loadeddata', setRestingFrame, { once: true });
        }
      }
    }

    function replayCurrentViewAnimation() {
      const view = viewById(state.viewId);
      if (view.type !== 'video') {
        setView('l1');
        return;
      }
      syncExplorerStageMedia(true, null);
    }

    function selectZoneInExplorer(zoneId) {
      const prevViewId = state.viewId;
      state.activeZoneId = zoneId;
      const bestViewId = pickBestViewForZone(zoneId);

      if (bestViewId !== prevViewId) {
        state.viewId = bestViewId;
        syncExplorerStageMedia(true, prevViewId);
      } else {
        updateThreeWallHighlights();
        refreshExplorerUIOnly();
      }
    }

    function setView(viewId) {
      const prevViewId = state.viewId;
      state.viewId = viewId;
      // When switching to a new view, if the current active zone isn't in that view, pick the first zone in that view
      const availableZones = zonesInView(viewId);
      if (availableZones.length && !availableZones.includes(state.activeZoneId)) {
        state.activeZoneId = availableZones[0];
      }
      syncExplorerStageMedia(true, prevViewId);
    }

    function setMode(modeId) {
      const m = VIEW_MODES.find(x => x.id === modeId);
      if (!m) return;
      const withZone = m.views.find(id => ZONE_SHAPES[state.activeZoneId] && ZONE_SHAPES[state.activeZoneId][id]);
      setView(withZone || m.views[0]);
    }

    function stepView(dir) {
      const m = VIEW_MODES.find(x => x.id === viewById(state.viewId).mode);
      const i = m.views.indexOf(state.viewId);
      setView(m.views[(i + dir + m.views.length) % m.views.length]);
    }

    function toggleShowAllColors() {
      state.showAllColors = !state.showAllColors;
      updateThreeWallHighlights();

    function zoneTip(e, zid) {

      tip.style.opacity = 1;
      const r = stage.getBoundingClientRect();
      const x = e.clientX - r.left + 14;
      const y = e.clientY - r.top + 16;
      tip.style.left = Math.max(8, Math.min(x, r.width - tip.offsetWidth - 8)) + 'px';
      tip.style.top = Math.max(8, Math.min(y, r.height - tip.offsetHeight - 8)) + 'px';
    }

    function hideZoneTip() {

              return `
                <div class="flex justify-start">
                  <div class="max-w-[90%] sm:max-w-[85%] bg-[#FFFFFF] border border-[#E4E1DA] rounded-[16px] rounded-tl-xs p-4 space-y-3">
                    ${msg.verified ? `
                      <div class="flex items-center gap-2">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-[#EAF5EF] text-[#2F8F5B] border border-[#2F8F5B]/30">
                          <span class="w-2 h-2 rounded-full bg-[#2F8F5B]"></span>
                          Verified Rule Answer
                        </span>
                      </div>
                    ` : ''}

                    <p class="text-sm sm:text-base text-[#1A1A1A] leading-relaxed">
                      ${msg.text}
                    </p>

                    ${msg.citation ? `
                      <div class="bg-[#F7F6F3] rounded-[12px] p-3.5 border border-[#E4E1DA] border-t-[3px] border-t-[#f48436]">
                        <div class="text-xs font-bold text-[#1A1A1A]">📜 ${msg.citation.title}</div>
                        <div class="text-xs text-[#666666] mt-1">${msg.citation.text}</div>
                      </div>
                    ` : ''}

                    ${linkedZone ? `
                      <div class="pt-1 flex flex-wrap items-center gap-2">
                        <button
                          onclick="toggleZoneInChecklist('${linkedZone.id}')"
                          class="px-3.5 py-2 rounded-[12px] text-xs font-bold transition cursor-pointer bg-[#C7281E] hover:bg-[#A82018] text-white"
                        >
                          ${isZoneInChecklist ? `✓ Added "${linkedZone.name}" to checklist` : `+ Add "${linkedZone.name}" to checklist`}
                        </button>
                        <button
                          onclick="navigate('/explorer', { zoneId: '${linkedZone.id}' })"
                          class="px-3 py-2 rounded-[12px] text-xs font-semibold bg-[#F7F6F3] text-[#e93b30] hover:underline border border-[#E4E1DA] cursor-pointer"
                        >
                          Inspect in 3D Animation →
                        </button>
                      </div>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}

            ${state.isBotTyping ? `
              <div class="flex justify-start">
                <div class="bg-[#FFFFFF] border border-[#E4E1DA] rounded-[16px] px-4 py-3 flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-[#e93b30] typing-dot"></span>
                  <span class="w-2 h-2 rounded-full bg-[#e93b30] typing-dot"></span>
                  <span class="w-2 h-2 rounded-full bg-[#e93b30] typing-dot"></span>
                  <span class="text-xs text-[#666666] ml-2">Checking township clauses...</span>
                </div>
              </div>
            ` : ''}
          </div>

          <div class="px-4 py-2.5 bg-[#FFFFFF] border-t border-[#E4E1DA]">
            <div class="text-[11px] text-[#666666] mb-1.5 font-medium">Suggested questions:</div>
            <div class="flex items-center gap-2 overflow-x-auto pb-1">
              ${SUGGESTED_QUESTIONS.map(q => `
                <button
                  onclick="sendChatQuestion('${q.replace(/'/g, "\\'")}')"
                  class="shrink-0 px-3 py-1.5 rounded-full bg-[#F7F6F3] hover:bg-[#f49c9c]/15 text-[#1A1A1A] border border-[#E4E1DA] hover:border-[#f46c6c] text-xs font-semibold transition cursor-pointer"
                >
                  ${q}
                </button>
              `).join('')}
            </div>
          </div>

          <form
            onsubmit="event.preventDefault(); sendChatQuestion();"
            class="p-3 sm:p-4 bg-[#FFFFFF] border-t border-[#E4E1DA] flex items-center gap-2.5"
          >
            <input
              id="assistant-input"
              type="text"
              placeholder="Ask about walls, extensions, permits, work hours, gates..."
              class="flex-1 bg-[#F7F6F3] border border-[#E4E1DA] focus:border-[#e93b30] rounded-[14px] px-4 py-3 text-sm text-[#1A1A1A] placeholder-[#666666] outline-none"
            />
            <button
              type="submit"
              class="px-5 py-3 rounded-[14px] bg-[#C7281E] hover:bg-[#A82018] text-white font-bold text-sm transition cursor-pointer shrink-0"
            >
              Send
            </button>
          </form>
        </div>
      `;
    }

    /********************************************************************
     * TASK 7: COMMUNITY FEED, POST DETAIL & NEW POST MODAL
     ********************************************************************/
    function handleCommunitySearch(val) {
      state.communitySearch = val;
      renderApp();
      const input = document.getElementById('community-search-input');
      if (input) {
        input.focus();
        input.setSelectionRange(val.length, val.length);
      }
    }

    function setCommunityFilter(cat) {
      state.communityFilter = cat;
      renderApp();
    }

    function openNewPostModal(open) {
      state.isNewPostModalOpen = open;
      renderApp();
    }

    function submitNewCommunityPost(e) {
      e.preventDefault();
      const titleEl = document.getElementById('new-post-title');
      const textEl = document.getElementById('new-post-text');
      const catEl = document.getElementById('new-post-category');
      if (!titleEl || !textEl || !catEl) return;

      const title = titleEl.value.trim();
      const text = textEl.value.trim();
      const category = catEl.value;
      if (!title || !text) return;

      const newPost = {
        id: 'post-' + Date.now(),
        title,
        text,
        author: `Resident (${state.project})`,
        time: 'Just now',
        category,
        label: 'Resident opinion',
        comments: []
      };

      state.posts.unshift(newPost);
      state.isNewPostModalOpen = false;
      showToast('Published your post to the Community feed');
      renderApp();
    }

    function submitNewComment(e, postId) {
      e.preventDefault();
      const input = document.getElementById('new-comment-input');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;

      const post = state.posts.find(p => p.id === postId);
      if (post) {
        post.comments.push({
          id: 'c-' + Date.now(),
          author: `You (${state.project})`,
          time: 'Just now',
          text
        });
        input.value = '';
        showToast('Comment added');
        renderApp();
      }
    }

    function renderCommunityScreen() {
      const categories = ['All', 'Tips', 'Vendors', 'Questions'];
      const query = state.communitySearch.toLowerCase().trim();

      const filteredPosts = state.posts.filter(p => {
        const matchesCat = state.communityFilter === 'All' || p.category === state.communityFilter;
        const matchesQuery = !query ||
          p.title.toLowerCase().includes(query) ||
          p.text.toLowerCase().includes(query) ||
          p.author.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });

      return `
        <div class="max-w-4xl mx-auto space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl sm:text-3xl font-bold text-[#e93b30] pb-1.5 border-b-[3px] border-[#f48436] inline-block">Township Community</h1>
              <p class="text-xs sm:text-sm text-[#666666] mt-2">
                Official rule reminders and real renovation experiences from Sime Darby Property residents
              </p>
            </div>
            <button
              onclick="openNewPostModal(true)"
              class="px-5 py-3 rounded-[16px] bg-[#C7281E] hover:bg-[#A82018] text-white font-bold text-sm transition cursor-pointer"
            >
              + New post
            </button>
          </div>

          <div class="bg-[#F7F6F3] rounded-[16px] p-4 border border-[#E4E1DA] space-y-3">
            <input
              id="community-search-input"
              type="text"
              value="${state.communitySearch.replace(/"/g, '&quot;')}"
              oninput="handleCommunitySearch(this.value)"
              placeholder="Search tips, vendors, wet kitchen, dust control, gate..."
              class="w-full bg-[#FFFFFF] border border-[#E4E1DA] focus:border-[#e93b30] rounded-[14px] px-4 py-3 text-sm text-[#1A1A1A] placeholder-[#666666] outline-none"
            />
            <div class="flex flex-wrap items-center gap-2">
              ${categories.map(cat => `
                <button
                  onclick="setCommunityFilter('${cat}')"
                  class="px-3.5 py-1.5 rounded-full text-xs font-semibold transition cursor-pointer border ${
                    state.communityFilter === cat
                      ? 'bg-[#fbbc76]/25 text-[#1A1A1A] border-[#e93b30]'
                      : 'bg-[#FFFFFF] text-[#666666] hover:text-[#1A1A1A] border-[#E4E1DA] hover:border-[#f46c6c]'
                  }"
                >
                  ${cat}
                </button>
              `).join('')}
            </div>
          </div>

          <div class="space-y-3.5">
            ${filteredPosts.length === 0 ? `
              <div class="bg-[#F7F6F3] rounded-[16px] p-8 text-center border border-[#E4E1DA]">
                <p class="text-base font-semibold text-[#1A1A1A]">No posts match your search.</p>
                <button onclick="state.communitySearch=''; state.communityFilter='All'; renderApp();" class="mt-3 text-xs font-semibold text-[#e93b30] underline cursor-pointer">
                  Clear filters
                </button>
              </div>
            ` : filteredPosts.map(post => {
              const isOfficial = post.label === 'Official rule';
              return `
                <div
                  onclick="navigate('/community-detail', { postId: '${post.id}' })"
                  class="bg-[#F7F6F3] rounded-[16px] p-5 border transition cursor-pointer hover:border-[#f46c6c] hover:bg-[#f49c9c]/10 ${
                    isOfficial ? 'border-[#E4E1DA] border-t-[3px] border-t-[#f48436]' : 'border-[#E4E1DA]'
                  }"
                >
                  <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
                    <div class="flex items-center gap-2">
                      <span class="px-3 py-1 rounded-full text-xs font-bold border ${
                        isOfficial
                          ? 'bg-[#fbbc76]/25 text-[#1A1A1A] border-[#f48436]'
                          : 'bg-[#FFFFFF] text-[#666666] border-[#E4E1DA]'
                      }">
                        ${isOfficial ? '🏛️ Official rule' : '💬 Resident opinion'}
                      </span>
                      <span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-[#FFFFFF] text-[#1A1A1A] border border-[#E4E1DA]">
                        ${post.category}
                      </span>
                    </div>
                    <span class="text-xs text-[#666666]">${post.time}</span>
                  </div>

                  <h2 class="text-lg font-bold text-[#1A1A1A]">${post.title}</h2>
                  <p class="mt-1.5 text-sm text-[#666666] line-clamp-2 leading-relaxed">
                    ${post.text}
                  </p>

                  <div class="mt-4 pt-3 border-t border-[#E4E1DA] flex items-center justify-between text-xs text-[#666666]">
                    <span>By <strong class="text-[#1A1A1A]">${post.author}</strong></span>
                    <span class="text-[#e93b30] font-semibold">💬 ${post.comments.length} comment(s) →</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        ${state.isNewPostModalOpen ? `
          <div class="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
            <div class="bg-[#FFFFFF] rounded-[16px] max-w-lg w-full p-6 border border-[#E4E1DA] border-t-[3px] border-t-[#f48436] animate-page">
              <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-[#e93b30]">Share with Neighbors</h2>
                <button onclick="openNewPostModal(false)" class="text-[#666666] hover:text-[#1A1A1A] text-xl font-bold cursor-pointer">×</button>
              </div>
              <div class="mb-4 px-3 py-2 rounded-[12px] bg-[#F7F6F3] border border-[#E4E1DA] text-xs text-[#666666]">
                Note: All resident posts are automatically labeled <strong class="text-[#1A1A1A]">Resident opinion</strong>.
              </div>
              <form onsubmit="submitNewCommunityPost(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold uppercase text-[#666666] mb-1">Category</label>
                  <select id="new-post-category" class="w-full bg-[#F7F6F3] border border-[#E4E1DA] rounded-[12px] px-3.5 py-2.5 text-sm text-[#1A1A1A] outline-none">
                    <option value="Tips">Tips</option>
                    <option value="Vendors">Vendors</option>
                    <option value="Questions">Questions</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold uppercase text-[#666666] mb-1">Title</label>
                  <input id="new-post-title" required type="text" placeholder="e.g., Great experience with our awning permit submission" class="w-full bg-[#F7F6F3] border border-[#E4E1DA] rounded-[12px] px-3.5 py-2.5 text-sm text-[#1A1A1A] outline-none" />
                </div>
                <div>
                  <label class="block text-xs font-semibold uppercase text-[#666666] mb-1">Your Message</label>
                  <textarea id="new-post-text" required rows="4" placeholder="Share your tip, vendor review, or question..." class="w-full bg-[#F7F6F3] border border-[#E4E1DA] rounded-[12px] px-3.5 py-2.5 text-sm text-[#1A1A1A] outline-none"></textarea>
                </div>
                <div class="flex justify-end gap-2.5 pt-2">
                  <button type="button" onclick="openNewPostModal(false)" class="px-4 py-2.5 rounded-[12px] border border-[#E4E1DA] text-sm text-[#666666] hover:text-[#1A1A1A] cursor-pointer">
                    Cancel
                  </button>
                  <button type="submit" class="px-5 py-2.5 rounded-[12px] bg-[#C7281E] hover:bg-[#A82018] text-white font-bold text-sm cursor-pointer">
                    Publish Post
                  </button>
                </div>
              </form>
            </div>
          </div>
        ` : ''}
      `;
    }

    function renderCommunityDetailScreen() {
      const post = state.posts.find(p => p.id === state.selectedPostId) || state.posts[0];
      const isOfficial = post.label === 'Official rule';

      return `
        <div class="max-w-3xl mx-auto space-y-5">
          <button
            onclick="navigate('/community')"
            class="inline-flex items-center gap-2 text-sm font-semibold text-[#e93b30] hover:underline cursor-pointer"
          >
            ← Back to Community feed
          </button>

          <div class="bg-[#F7F6F3] rounded-[16px] p-6 border border-[#E4E1DA] border-t-[3px] border-t-[#f48436]">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div class="flex items-center gap-2">
                <span class="px-3 py-1 rounded-full text-xs font-bold border ${
                  isOfficial
                    ? 'bg-[#fbbc76]/25 text-[#1A1A1A] border-[#f48436]'
                    : 'bg-[#FFFFFF] text-[#666666] border-[#E4E1DA]'
                }">
                  ${isOfficial ? '🏛️ Official rule' : '💬 Resident opinion'}
                </span>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-[#FFFFFF] text-[#1A1A1A] border border-[#E4E1DA]">
                  ${post.category}
                </span>
              </div>
              <span class="text-xs text-[#666666]">${post.time}</span>
            </div>

            <h1 class="text-xl sm:text-2xl font-bold text-[#e93b30]">${post.title}</h1>
            <div class="text-xs text-[#666666] mt-1">Posted by <strong class="text-[#1A1A1A]">${post.author}</strong></div>

            <p class="mt-4 text-sm sm:text-base text-[#1A1A1A] leading-relaxed whitespace-pre-line">
              ${post.text}
            </p>
          </div>

          <div class="bg-[#F7F6F3] rounded-[16px] p-6 border border-[#E4E1DA] space-y-4">
            <h2 class="text-lg font-bold text-[#e93b30] pb-1 border-b-[3px] border-[#f48436] inline-block">Comments (${post.comments.length})</h2>

            <div class="space-y-3">
              ${post.comments.map(c => `
                <div class="bg-[#FFFFFF] rounded-[14px] p-4 border border-[#E4E1DA]">
                  <div class="flex items-center justify-between text-xs text-[#666666] mb-1.5">
                    <strong class="text-[#1A1A1A]">${c.author}</strong>
                    <span>${c.time}</span>
                  </div>
                  <p class="text-sm text-[#1A1A1A] leading-relaxed">${c.text}</p>
                </div>
              `).join('')}
            </div>

            <form onsubmit="submitNewComment(event, '${post.id}')" class="pt-3 flex gap-2.5">
              <input
                id="new-comment-input"
                type="text"
                required
                placeholder="Write a helpful reply or tip..."
                class="flex-1 bg-[#FFFFFF] border border-[#E4E1DA] focus:border-[#e93b30] rounded-[14px] px-4 py-3 text-sm text-[#1A1A1A] placeholder-[#666666] outline-none"
              />
              <button
                type="submit"
                class="px-5 py-3 rounded-[14px] bg-[#C7281E] hover:bg-[#A82018] text-white font-bold text-sm transition cursor-pointer shrink-0"
              >
                Reply
              </button>
            </form>
          </div>
        </div>
      `;
    }

    /********************************************************************
     * MAIN RENDER ORCHESTRATOR
     ********************************************************************/
    function renderApp() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      let pageContent = '';
      if (state.route === '/welcome') {
        pageContent = renderWelcomeScreen();
      } else if (state.route === '/setup') {
        pageContent = renderSetupScreen();
      } else if (state.route === '/home') {
        pageContent = renderHomeScreen();
      } else if (state.route === '/explorer') {
        pageContent = renderExplorerScreen();
      } else if (state.route === '/checklist') {
        pageContent = renderChecklistScreen();
      } else if (state.route === '/assistant') {
        pageContent = renderAssistantScreen();
      } else if (state.route === '/community') {
        pageContent = renderCommunityScreen();
      } else if (state.route === '/community-detail') {
        pageContent = renderCommunityDetailScreen();
      } else {
        pageContent = renderWelcomeScreen();
      }

      appEl.innerHTML = renderNavigationShell(pageContent);
    }

    function syncRouteFromHash() {
      const raw = (window.location.hash || '').replace(/^#\/?/, '/');
      const validRoutes = ['/welcome', '/setup', '/home', '/explorer', '/checklist', '/assistant', '/community', '/community-detail'];
      if (validRoutes.includes(raw)) {
        if (!state.mode && raw !== '/welcome' && raw !== '/setup') {
          state.mode = 'explore';
        }
        state.route = raw;
      }
    }

    window.addEventListener('load', function () {
      syncRouteFromHash();
      renderApp();
      preloadMediaAssets();
      if (state.route === '/explorer') {
        syncExplorerStageMedia(false);
      }
    });

    window.addEventListener('hashchange', function () {
      syncRouteFromHash();
      renderApp();
      if (state.route === '/explorer') {
        syncExplorerStageMedia(false);
      }
    });

    window.addEventListener('resize', function () {
      if (state.route === '/explorer') {
        resizeThreeHouse();
      }
    });
  </script>
</div>

</body></html>
